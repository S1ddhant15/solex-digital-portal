  <g opacity=".72" filter="url(#shadow)" transform="translate(740 105) rotate(-12)">
    <rect width="730" height="520" rx="20" fill="#0b1115" stroke="#c9d2d5" stroke-opacity=".32" stroke-width="12"/>
    <rect x="22" y="22" width="686" height="476" rx="9" fill="url(#cells)"/>
    <rect x="22" y="22" width="686" height="476" rx="9" fill="url(#shine)"/>
    <path d="M365 22v476M22 260h686" stroke="#f47b20" stroke-opacity=".17" stroke-width="3"/>
  </g>
  <g opacity=".28" transform="translate(960 610) rotate(8)">
    <rect width="500" height="330" rx="16" fill="#10171b" stroke="#f47b20" stroke-width="7"/>
    <rect x="18" y="18" width="464" height="294" rx="7" fill="url(#cells)"/>
  </g>
  <path d="M0 820C320 740 560 790 830 920L0 1000Z" fill="#f47b20" fill-opacity=".18"/>
