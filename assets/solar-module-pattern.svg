<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract solar module background">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b35"/>
      <stop offset="0.55" stop-color="#304650"/>
      <stop offset="1" stop-color="#152129"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f47b20" stop-opacity=".16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <pattern id="cells" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="68" height="68" rx="3" fill="url(#panel)" stroke="#94a7ae" stroke-opacity=".22"/>
      <path d="M34 3v62M3 34h62" stroke="#d3dee1" stroke-opacity=".09"/>
