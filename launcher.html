<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181b1e">
  <title>Launch Solex Digital Operations Portal</title>
  <link rel="stylesheet" href="assets/portal.css">
  <link rel="stylesheet" href="assets/orange-grey.css">
  <link rel="stylesheet" href="assets/premium.css">
</head>
<body class="launcher-page">
  <main class="launcher-shell">
    <section class="launcher-card">
      <img class="launcher-brand-logo" src="assets/solex-logo.png" alt="Solex Energies">
      <span class="launcher-eyebrow">SOLEX ECOSYSTEM</span>
      <h1>Digital Operations Portal</h1>
      <p class="ecosystem-flow" aria-label="See, Analyze, Solve, Learn, Improve"><b>SEE</b><i>→</i><b>ANALYZE</b><i>→</i><b>SOLVE</b><i>→</i><b>LEARN</b><i>→</i><b>IMPROVE</b></p>
      <div class="launcher-actions">
        <button id="openPortalButton" class="launcher-button" type="button"><span>Open Digital Operations Portal</span><b aria-hidden="true">→</b></button>
        <a id="launcherFallback" class="launcher-fallback" href="index.html?standalone=1" target="_blank">Popup blocked — open portal in a new tab</a>
      </div>
      <p id="launcherMessage" class="launcher-message" aria-live="polite"></p>
    </section>
  </main>
  <script src="assets/launcher.js"></script>
</body>
</html>
